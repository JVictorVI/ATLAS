<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        style-src {{cspSource}} 'unsafe-inline';
        font-src {{cspSource}} data:;
        img-src {{cspSource}} data:;
        script-src {{cspSource}} 'unsafe-inline';
      "
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repositório de Modelos</title>
    <link
      rel="stylesheet"
      href="{{codiconsUri}}"
    />
    <link rel="stylesheet" href="{{styleUri}}" />
  </head>
  <body>
    <main class="model-detail-view" id="model-detail-view"></main>
    <script>
      window.__ATLAS_INITIAL_SEARCH_MODEL_ID__ = {{initialSearchModelId}};
      window.__ATLAS_HUGGINGFACE_ICON_URI__ = "{{huggingFaceIconUri}}";
    </script>
    <script src="{{markedUri}}"></script>
    {{scriptTags}}
  </body>
</html>
